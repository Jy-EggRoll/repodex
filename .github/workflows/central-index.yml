name: Central Repository Index

on:
  push: # 任意分支推送都跑一次（本流不写回仓库，无自循环风险）
  schedule:
    - cron: "0 * * * *" # 每小时整点增量同步（无变化的仓库直接跳过）
  workflow_dispatch: # 手动触发，可指定单个仓库补跑、可 dry-run
    inputs:
      repos:
        description: "仅处理这些仓库（逗号分隔 owner/repo，留空则全部）"
        required: false
        default: ""
      dry_run:
        description: "只打印计划，不写 KV"
        required: false
        default: "false"

concurrency:
  group: central-index
  cancel-in-progress: false

jobs:
  index:
    name: Sync Indexes to KV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync
        env:
          REPOS_PAT: ${{ secrets.REPOS_PAT }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_NAMESPACE_ID: ${{ secrets.CF_NAMESPACE_ID }}
          REPOS_ONLY: ${{ inputs.repos }}
          DRY_RUN: ${{ inputs.dry_run == 'true' && '1' || '' }}
        run: node scripts/generate_index.mjs 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
