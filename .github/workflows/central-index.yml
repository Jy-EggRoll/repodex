name: Central Repository Index

on:
  push: # runs on any branch push (this workflow never writes back to the repo, so no self-trigger loop)
  schedule:
    - cron: "42 * * * *" # incremental sync at minute 42 of every hour: off the hour mark, when GitHub runners are less contended
  workflow_dispatch: # manual trigger: re-run a single repo or do a dry run
    inputs:
      repos:
        description: "Process only these repos (comma-separated owner/repo; empty means all)"
        required: false
        default: ""
      dry_run:
        description: "Report stats only, do not write KV"
        required: false
        default: "false"

concurrency:
  group: central-index
  cancel-in-progress: false

jobs:
  index:
    name: Sync Indexes to KV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Sync
        env:
          REPOS_PAT: ${{ secrets.REPOS_PAT }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_NAMESPACE_ID: ${{ secrets.CF_NAMESPACE_ID }}
          REPOS_ONLY: ${{ inputs.repos }}
          DRY_RUN: ${{ inputs.dry_run == 'true' && '1' || '' }}
        # stdout (clean markdown) goes to the Summary; stderr (colored progress) stays in the console log
        run: node scripts/generate_index.mjs > "$GITHUB_STEP_SUMMARY"
