<!doctype html>
<html lang="en" data-theme="kumo" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RepoDex – Repository info and file search</title>
    <meta
      name="description"
      content="RepoDex: fuzzy file search across GitHub repositories and branches, with pinyin and Chinese filename support."
    />
    <meta name="theme-color" content="#f5f5f5" />
    <link rel="icon" href="/favicon.ico" />
    <script>
      // Set theme and language before first paint to avoid flashes.
      // Theme: stored value > system preference. Language: stored "lang" > navigator.
      try {
        var s = localStorage.getItem("theme");
        var m =
          s === "light" || s === "dark"
            ? s
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.setAttribute("data-theme", "kumo");
        document.documentElement.setAttribute("data-mode", m);
        var l = localStorage.getItem("lang");
        if (l !== "en" && l !== "zh-cn") l = /^zh/i.test(navigator.language || "") ? "zh-cn" : "en";
        document.documentElement.setAttribute("lang", l === "zh-cn" ? "zh-CN" : "en");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
